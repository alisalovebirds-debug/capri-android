
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capri.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.capri.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
