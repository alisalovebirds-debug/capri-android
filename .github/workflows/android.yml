name: Build Capri Android APK
'on':
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build debug APK
runs-on: ubuntu-latest
steps:
- name: Check out Android project
uses: actions/checkout@v4

  - name: Check out original Capri
    uses: actions/checkout@v4
    with:
      repository: mochiiwuff/capri-desktop
      path: capri-source

  - name: Copy Capri files and install bridge
    shell: bash
    run: |
      set -eu
      BRIDGE="app/src/main/assets/src/renderer/js/android-host.js"
      if [ ! -f "$BRIDGE" ]; then
        echo "ERROR: android-host.js is missing."
        exit 1
      fi
      cp "$BRIDGE" /tmp/android-host.js
      mkdir -p app/src/main/assets/src
      mkdir -p app/src/main/assets/assets
      rm -rf app/src/main/assets/src/renderer
      cp -R capri-source/src/renderer app/src/main/assets/src/renderer
      cp -R capri-source/assets/. app/src/main/assets/assets/
      INDEX="app/src/main/assets/src/renderer/index.html"
      if [ ! -f "$INDEX" ]; then
        echo "ERROR: index.html was not found."
        exit 1
      fi
      mkdir -p app/src/main/assets/src/renderer/js
      cp /tmp/android-host.js app/src/main/assets/src/renderer/js/android-host.js
      python3 - <<'PY'
      from pathlib import Path
      index = Path("app/src/main/assets/src/renderer/index.html")
      html = index.read_text(encoding="utf-8")
      marker = '<script type="module" src="js/app.js"></script>'
      tag = '<script src="js/android-host.js"></script>'
      if tag not in html:
          if marker not in html:
              raise SystemExit("ERROR: app.js script tag not found.")
          html = html.replace(marker, tag + "\n" + marker, 1)
      index.write_text(html, encoding="utf-8")
      print("Renderer and Android bridge installed.")
      PY

  - name: Add image-load diagnostics
    shell: bash
    run: |
      set -eu
      python3 - <<'PY'
      from pathlib import Path
      path = Path("app/src/main/assets/src/renderer/js/app.js")
      if not path.exists():
          raise SystemExit("ERROR: app.js was not found.")
      code = path.read_text(encoding="utf-8")
      old = "img.onerror = reject;"
      new = "img.onerror = () => reject(new Error('Failed to load image: ' + src));"
      if new not in code:
          if old not in code:
              raise SystemExit("ERROR: Image error handler not found.")
          code = code.replace(old, new, 1)
      path.write_text(code, encoding="utf-8")
      print("Image diagnostics enabled.")
      PY

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '9.6.0'

  - name: Build Android APK
    run: gradle :app:assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    if: success()
    with:
      name: Capri-Android-debug
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
