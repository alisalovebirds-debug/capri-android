name: Build Capri Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Check out original Capri
        uses: actions/checkout@v4
        with:
          repository: mochiiwuff/capri-desktop
          path: capri-source

      - name: Copy original Capri files
        run: |
          mkdir -p app/src/main/assets/src
          mkdir -p app/src/main/assets/assets

          cp -R capri-source/src/renderer \
            app/src/main/assets/src/renderer

          cp -R capri-source/assets/. \
            app/src/main/assets/assets/

          echo "Checking for Android bridge..."
          find app/src/main/assets/src/renderer \
            -name "android-host.js" -print

          python3 - <<'PY'
          from pathlib import Path

          renderer = Path("app/src/main/assets/src/renderer")
          index = renderer / "index.html"
          bridge = renderer / "js/android-host.js"

          if not index.exists():
              raise SystemExit("ERROR: Capri index.html was not copied.")

          if not bridge.exists():
              raise SystemExit(
                  "ERROR: android-host.js is missing from the copied renderer. "
                  "The build cannot continue until the bridge is copied."
              )

          html = index.read_text(encoding="utf-8")
          marker = '<script type="module" src="js/app.js"></script>'
          bridge_tag = '<script src="js/android-host.js"></script>'

          if bridge_tag not in html:
              if marker not in html:
                  raise SystemExit(
                      "ERROR: Could not find the app.js script in index.html."
                  )
              html = html.replace(marker, bridge_tag + "\n" + marker)

          index.write_text(html, encoding="utf-8")
          print("Android bridge found and script tag configured.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Capri-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
