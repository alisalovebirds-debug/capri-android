name: Build Capri Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Check out original Capri
        uses: actions/checkout@v4
        with:
          repository: mochiiwuff/capri-desktop
          path: capri-source

      - name: Copy Capri files and install bridge
        shell: bash
        run: |
          set -eu
          BRIDGE="app/src/main/assets/src/renderer/js/android-host.js"
          test -f "$BRIDGE"
          cp "$BRIDGE" /tmp/android-host.js
          mkdir -p app/src/main/assets/src
          mkdir -p app/src/main/assets/assets
          rm -rf app/src/main/assets/src/renderer
          cp -R capri-source/src/renderer app/src/main/assets/src/renderer
          cp -R capri-source/assets/. app/src/main/assets/assets/
          INDEX="app/src/main/assets/src/renderer/index.html"
          test -f "$INDEX"
          mkdir -p app/src/main/assets/src/renderer/js
          cp /tmp/android-host.js app/src/main/assets/src/renderer/js/android-host.js
          if ! grep -q 'js/android-host.js' "$INDEX"; then
            sed -i 's|<script type="module" src="js/app.js"></script>|<script src="js/android-host.js"></script>\
          <script type="module" src="js/app.js"></script>|' "$INDEX"
          fi

      
      - name: Add image-load diagnostics
        shell: bash
        run: |
          set -eu
          APP="app/src/main/assets/src/renderer/js/app.js"
          test -f "$APP"
          python3 - "$APP" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          source = source.replace(
              "img.onerror = reject;",
              "img.onerror = () => reject(new Error('Failed to load image: ' + src));"
          )

          source = source.replace(
              "console.error('[capri] boot failed', err);",
              "console.error('[capri] boot failed: ' + (err?.name || 'Error') + ': ' + (err?.message || String(err)) + '\\n' + (err?.stack || ''));"
          )

          path.write_text(source)
          print("Diagnostics patch applied.")
          PY


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -eu
          find app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capri-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
