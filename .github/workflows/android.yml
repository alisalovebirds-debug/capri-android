name: Build Capri Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Check out original Capri
        uses: actions/checkout@v4
        with:
          repository: mochiiwuff/capri-desktop
          path: capri-source

      - name: Copy Capri files and install bridge
        run: |
          set -eu

          BRIDGE="app/src/main/assets/src/renderer/js/android-host.js"

          if [ ! -f "$BRIDGE" ]; then
            echo "ERROR: Local android-host.js is missing."
            exit 1
          fi

          cp "$BRIDGE" /tmp/android-host.js

          echo "Checking original renderer..."
          find capri-source/src/renderer -maxdepth 3 -name "index.html" -print

          mkdir -p app/src/main/assets/src
          mkdir -p app/src/main/assets/assets

          rm -rf app/src/main/assets/src/renderer
          cp -R capri-source/src/renderer app/src/main/assets/src/renderer

          cp -R capri-source/assets/. app/src/main/assets/assets/

          echo "Checking copied index.html..."
          find app/src/main/assets/src/renderer -maxdepth 3 -name "index.html" -print

          INDEX="app/src/main/assets/src/renderer/index.html"

          if [ ! -f "$INDEX" ]; then
            echo "ERROR: Renderer index.html was not found at the expected path."
            exit 1
          fi

          mkdir -p app/src/main/assets/src/renderer/js
          cp /tmp/android-host.js app/src/main/assets/src/renderer/js/android-host.js

          python3 - <<'PY'
          from pathlib import Path

          index = Path("app/src/main/assets/src/renderer/index.html")
          html = index.read_text(encoding="utf-8")
          marker = '<script type="module" src="js/app.js"></script>'
          tag = '<script src="js/android-host.js"></script>'

          if tag not in html:
              if marker not in html:
                  raise SystemExit("ERROR: Could not find app.js script tag.")
              html = html.replace(marker, tag + "\n" + marker)

          index.write_text(html, encoding="utf-8")
          print("Capri HTML and Android bridge are ready.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Capri-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
