
name: Build Capri Android APK
'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Check out original Capri
        uses: actions/checkout@v4
        with:
          repository: mochiiwuff/capri-desktop
          path: capri-source
